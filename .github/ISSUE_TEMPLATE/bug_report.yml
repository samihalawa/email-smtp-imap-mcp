name: Bug report
description: Report reproducible behavior that is not working as expected
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v2.1.2
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Configuration
        - SMTP sending
        - IMAP search and reading
        - Replies and forwarding
        - Message organization
        - MCP client integration
        - Other
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include reproducible steps and sanitized logs. Never include credentials or private email content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Node 22, macOS, Claude Desktop
    validations:
      required: true
