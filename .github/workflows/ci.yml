name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  static-analysis:
    name: FLOSS static security analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install semgrep==1.183.0
      - name: Scan every source file (no account or paid engine)
        run: >-
          semgrep scan --config p/javascript --config p/nodejs --config p/security-audit
          --config .semgrep/transport-security.yml
          --metrics off --error --strict --no-git-ignore --json-output semgrep-results.json src scripts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: static-analysis-${{ github.sha }}
          path: semgrep-results.json
          retention-days: 90
