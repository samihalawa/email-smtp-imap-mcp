# Minimal Dovecot for integration tests: STARTTLS with a test certificate, Maildir, RFC 6154 special folders.
protocols = imap
listen = *
# TLS only (STARTTLS on the plain port): the server refuses to authenticate in the clear, like the MCP server
# refuses to connect without verified TLS. The key is the public test-only identity from test/fixtures.
ssl = required
ssl_cert = </etc/dovecot/tls/cert.pem
ssl_key = </etc/dovecot/tls/key.pem
ssl_min_protocol = TLSv1.2
disable_plaintext_auth = yes
auth_mechanisms = plain login
mail_home = /srv/mail/%u
mail_location = maildir:~/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 1
log_path = /dev/stderr

passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/users
}
userdb {
  driver = static
  args = uid=vmail gid=vmail home=/srv/mail/%u
}

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
}
